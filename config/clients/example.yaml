# Client brand profile template. Copy to <slug>.yaml per client.
# Fictional example client; replace every value.
slug: almyra
code: ALMYRA            # used in asset/post names
name: Almyra Beach Lounge
type: beach bar         # any text; the form suggests villa, hotel, beach bar, restaurant, pharmacy…
location: Chania, Crete

accounts:               # the handles as the client knows them, one or several per platform (a second Instagram, a Russian TikTok); never store passwords
  instagram: ["@almyra.chania"]
  facebook: ["Almyra Beach Lounge"]
  tiktok: ["@almyra.chania"]
  linkedin: ["almyra-beach-lounge"]   # the company page slug or name

languages: [el, en]     # first = primary
extra_languages: []     # e.g. [de] for a villa with German guests

about:                  # what Claude plans and writes from; every fact in a post comes from here or from voice.facts
  description: Beach lounge on the sand west of Chania, sunbeds by day, cocktails and a short Cretan menu by night; run by the family since 2009
  audience: Couples and families from the UK, Germany and the Nordics in summer, locals from Chania at weekends; 30 to 55, mid to high budget
  offerings: Sunbeds and umbrellas, the cocktail list, a 12-dish Cretan menu, sunset table bookings, private events up to 40 people
  differentiators: The only lounge on this beach, a sunset view with no road in front, produce from the family's own land
  goals: Fill the sunset tables on weekdays in June and September; more bookings from Instagram
  current: "June 2027: the new cocktail list; live DJ every Friday from 20:00"

voice:
  tone: relaxed, warm, confident; premium without sounding formal
  person: we            # we | the venue name
  emoji: max 1 per caption, never in the first line
  cta_style: soft (book a sunbed, link in bio); never "Don't miss out!"
  banned_phrases: []    # client-specific, added on top of agency defaults in prompts/caption-draft.md
  words: []             # words and phrases the client likes, e.g. ["our beach", "το μαγαζί"]
  facts:                # repeated factual info must stay consistent
    - Open daily 10:00 to midnight, May to October
    - Sunbed booking by phone or Instagram DM

notes: ""               # anything else the team and Claude should know: the story of the place, what the owner cares about, what to avoid

pillars:                # optional: 4–5 per client with target share of posts; without any, Claude picks the topics
  place: 25
  food_drink: 25
  people: 15
  guests_ugc: 15
  offers: 20

hashtags:
  always: ["#chania", "#crete"]
  pool: ["#chaniabeach", "#cretesummer", "#beachbarcrete", "#greekislands"]
  max_per_post: 5

research:               # steers the trend research and the planner
  sources: []           # sites to search first, e.g. [cretalive.gr, chaniapost.eu]
  excluded_domains: []  # never cite these, e.g. a competitor's site
  excluded_topics: []   # never plan or caption these, e.g. [politics, alcohol prices]
  hashtags_to_watch: [] # weekly listening report, max 30 (Instagram's limit per account and week), e.g. [chaniabeach, cretefood]
  competitors: []       # public Instagram business accounts to watch, e.g: ["@otherbeachbar"]

approval:
  policy: required      # none | optional | required | multi_level
  sla_hours: 48
  auto_approve_on_timeout: false   # only allowed when policy is optional
  approvers:
    - name: Owner Name
      email: owner@example.com
      phone: "+30 69x xxx xxxx"     # for reminders
  email_monthly_report: false   # true mails each monthly report to the approvers as soon as it is written; off, the "Email to client" button on the report page sends it after you have read it

slots: []               # weekly posting slots, e.g. [mon 10:00, wed 18:00, fri 10:00]: "Next free slot" on the post form, the planner and the low-queue warning use them
saved_replies: []       # answers you give often, offered in the comment inbox, e.g. [{ label: Opening hours, text: "Ανοιχτά κάθε μέρα 10:00–02:00 / Open daily 10:00–02:00", keywords: [ώρες, hours] }]
                        # keywords (optional): a new Instagram or Facebook comment containing one of them gets that reply at once; complaints, questions and anything negative wait for a human
signatures: {}          # a line added under every caption of that platform at publish time, e.g. { facebook: "Κρατήσεις / Bookings: +30 28210 00000", linkedin: "almyra.gr" }
fields: {}              # placeholders for captions, signatures and the first comment, written as {{phone}} and filled at publish time, e.g. { phone: "+30 28210 00000", site: almyra.gr, booking: "https://almyra.gr/book" }
webhooks: []            # HTTPS URLs that get a signed JSON POST when a post is published, fails or needs a human (docs/api.md), e.g. [{ url: "https://example.com/hook", secret: "shared-secret", events: [post.published] }]
brand_color: ""         # the client's brand colour (#rrggbb): the titles of the Word topic plan are written in it; empty is dark grey
utm: false              # true adds utm_source=<platform>&utm_medium=social&utm_campaign=<post name> to every link in captions, first comments and Google buttons at publish time (links that already carry utm_ are left alone)

key_dates:
  - { date: 2027-05-01, label: Season opening }
  - { date: 2027-08-15, label: Dekapentavgoustos party }
